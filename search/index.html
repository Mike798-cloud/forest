<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Search</title><link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../styles/search.css"></head><body><header class="searchHead"><div class="brand"><span>◉</span> Atlas</div><form id="form"><input id="q" autocomplete="off" name="q" aria-label="搜索"><button aria-label="提交搜索">⌕</button></form><div class="searchTools">历史&nbsp;&nbsp;·&nbsp;&nbsp;安全搜索</div></header><nav class="tabs" id="tabs"><button data-t="all" class="on">全部</button><button data-t="news">新闻</button><button data-t="forum">论坛</button><button data-t="academic">学术</button><button data-t="docs">文档</button><button data-t="web">网页</button></nav><main class="searchLayout"><section class="wrap"><div class="count" id="count"></div><div id="results"></div><section class="related" id="related"></section><section id="recentGhost" class="related" style="display:none"></section></section><aside class="searchAside"><div class="asideCard"><b>本地历史索引</b><p>当前结果混合公开网页、旧缓存和资料镜像；时间戳来自抓取记录，不代表页面最后修改时间。</p><div><span>设备型号</span><strong>DSC-W220</strong></div><div><span>旧地名</span><strong>Ulen / 乌伦</strong></div></div><div class="asideCard faded"><b>检索习惯</b><p>旧设备、旧地名和案件编号通常比人物姓名更稳定，跨年代检索时尽量保留其中两个条件。</p></div></aside></main><script src="../assets/state.js"></script><script src="../assets/search-data.js"></script><script>if(!RF.requireMark('camera_db_read','../camera/w220.html','公开检索入口来自你刚才查到的停产相机型号。'))throw new Error('locked');const params=new URLSearchParams(location.search);q.value=params.get('q')||'DSC-W220 乌伦';let current=params.get('type')||'all';function tokens(s){return s.toLowerCase().replace(/[，。、“”·]/g,' ').split(/\s+/).filter(Boolean)}function score(d,ts){let s=0,hay=(d.title+' '+d.keywords+' '+d.snippet+' '+d.source).toLowerCase();for(const t of ts){if(hay.includes(t))s+=3;if(d.title.toLowerCase().includes(t))s+=5;if(d.keywords.toLowerCase().includes(t))s+=2}return s}function render(){const ts=tokens(q.value);let arr=SEARCH_DATA.map(d=>({...d,score:score(d,ts)})).filter(d=>d.score>0);arr.sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date));if(current!=='all')arr=arr.filter(d=>d.type===current);if(!arr.length){results.innerHTML='<div class="nores"><p>没有找到高度匹配的页面。</p><p>可以删除一个限定词，或尝试旧地名、英文拼写、设备型号。</p></div>';count.textContent='未找到匹配结果';related.innerHTML='';return}count.textContent=`找到 ${arr.length} 个高相关页面 · 本地历史索引与公开网页缓存`;results.innerHTML=arr.slice(0,12).map(d=>`<article class="r"><div class="source"><span class="fav">${d.source.slice(0,1)}</span><span>${d.source}</span></div><div class="url">${d.displayUrl}</div><h2><a target="_blank" rel="noopener" href="${d.url}">${d.title}</a></h2><p>${d.date} · ${d.snippet}</p></article>`).join('');related.innerHTML='<b>相关搜索</b><a href="?q=乌伦+2011+失踪">乌伦 2011 失踪</a><a href="?q=第三支流+居民">第三支流 居民</a><a href="?q=Ulen+旧地图">Ulen 旧地图</a><a href="?q=DSC-W220+序列号">DSC-W220 序列号</a>';RF.rememberSearch(q.value)}form.onsubmit=e=>{e.preventDefault();location.search='?q='+encodeURIComponent(q.value)};tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.t;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()});render();RF.mark('search_opened');function syncGhost(){const g=document.getElementById('recentGhost');if(!g)return;if(RF.has('last_log_read')){g.style.display='block';g.innerHTML='<b>最近检索</b><span style="display:block;margin-top:8px;color:#65717a">A2 A4 B4 · inward / name / voice</span>'}else g.style.display='none'}syncGhost();addEventListener('rainforest-statechange',syncGhost)</script></body></html>
