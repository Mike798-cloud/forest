<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Search</title><link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../styles/search.css"></head><body><header class="searchHead"><div class="brand">Atlas</div><form id="form"><input id="q" autocomplete="off" name="q"><button>搜索</button></form></header><nav class="tabs" id="tabs"><button data-t="all" class="on">全部</button><button data-t="news">新闻</button><button data-t="forum">论坛</button><button data-t="academic">学术</button><button data-t="docs">文档</button><button data-t="web">网页</button></nav><main class="wrap"><div class="count" id="count"></div><div id="results"></div><section class="related" id="related"></section></main><script src="../assets/state.js"></script><script src="../assets/search-data.js"></script><script>if(!RF.requireMark('camera_db_read','../camera/w220.html','你还没有从旧相机资料进入公开互联网检索。'))throw new Error('locked');const params=new URLSearchParams(location.search);q.value=params.get('q')||'DSC-W220 乌伦';let current=params.get('type')||'all';function tokens(s){return s.toLowerCase().replace(/[，。、“”]/g,' ').split(/\s+/).filter(Boolean)}function score(d,ts){let s=0,hay=(d.title+' '+d.keywords+' '+d.snippet+' '+d.source).toLowerCase();for(const t of ts){if(hay.includes(t))s+=3;if(d.title.toLowerCase().includes(t))s+=4;if(d.keywords.toLowerCase().includes(t))s+=2}return s}function render(){const ts=tokens(q.value);let arr=SEARCH_DATA.map(d=>({...d,score:score(d,ts)})).filter(d=>d.score>0);if(!arr.length&&ts.length){results.innerHTML='<div class="nores"><p>没有找到与全部关键词同时高度匹配的页面。</p><p>建议删除一个限定词，或尝试旧地名、英文拼写和型号。</p></div>';count.textContent='0 条高度相关结果';return}arr.sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date));if(current!=='all')arr=arr.filter(d=>d.type===current);count.textContent=`约 ${Math.max(12,arr.length*137)} 条结果（本地索引 0.${18+arr.length} 秒）`;results.innerHTML=arr.slice(0,12).map(d=>`<article class="r"><div class="source"><span class="fav">${d.source.slice(0,1)}</span><span>${d.source}</span></div><div class="url">${d.url.replace('../web/','atlas-index › cached › ')}</div><h2><a target="_blank" rel="noopener" href="${d.url}">${d.title}</a></h2><p>${d.date} · ${d.snippet}</p></article>`).join('');related.innerHTML='<b>相关搜索</b><a href="?q=乌伦+2011+失踪">乌伦 2011 失踪</a><a href="?q=第三支流+居民">第三支流 居民</a><a href="?q=Ulen+旧地图">Ulen 旧地图</a>';RF.rememberSearch(q.value)}form.onsubmit=e=>{e.preventDefault();location.search='?q='+encodeURIComponent(q.value)};tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.t;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()});render();RF.mark('search_opened')</script></body></html>
