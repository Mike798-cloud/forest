<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>UL-2011-44：乌伦河上游三人失联案件公开摘要</title><link href="/assets/common.css" rel="stylesheet"/><style>body{background:#f7f6f1}.mast{border-bottom:3px double #262626;padding:22px 5vw;display:flex;justify-content:space-between;align-items:end}.mast b{font:38px Georgia,"SimSun",serif}.article{max-width:820px;margin:45px auto;padding:0 24px}.article h1{font:44px/1.2 Georgia,"SimSun",serif}.byline{border-top:1px solid #aaa;border-bottom:1px solid #aaa;padding:9px 0;color:#666}.article p{font:18px/1.9 Georgia,"SimSun",serif}.article blockquote{font:22px/1.65 Georgia,serif;border-left:4px solid #922;padding-left:22px}.article a{color:#145b89}.paper{background:white;padding:24px 30px;border:1px solid #ccc}.warning{background:#fff3da;padding:12px 16px}</style></head><body><header class="mast"><b>国家搜救公开档案</b><span>ARCHIVE</span></header><article class="article"><h1>UL-2011-44：乌伦河上游三人失联案件公开摘要</h1><div class="byline">公开版本 · 2011-09-12归档</div><div class="paper"><p><b>失联人数：</b>3</p><p><b>最后可信区域：</b>第三支流以西约4.8km，坐标精度低</p><p><b>主要限制：</b>持续强降雨、河谷云底低、旧河道与现河道位置差异</p><p><b>结论：</b>未找到失联人员；发现一处被弃置的食品袋和相机电池，但无法确认归属。</p></div><p>档案附注指出，搜救组曾引用一份1978年田野测绘手册校对旧河道名称。该资料现由雨林大学数字馆藏公开。</p><p><a data-new="" href="/archive/1978.html" rel="noopener" target="_blank">雨林大学数字馆藏：Wen / 1978 乌伦上游田野手册 ↗</a></p></article><script src="/assets/state.js"></script><script>RF.ambient('room.ogg');RF.bindCross();RF.recordOpen('sar2011.html');RF.mark('old_case_read',5);</script></body></html>
