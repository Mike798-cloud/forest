<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACRP · 文件查看</title><link rel="stylesheet" href="../assets/common.css"><style>html,body{height:100%;margin:0;background:#0f1314;color:#dfe6e3;font-family:Arial,"Microsoft YaHei",sans-serif}.app{height:100%;display:grid;grid-template-rows:52px 1fr}.top{display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 16px;border-bottom:1px solid #30393a;background:#151b1c}.title b{display:block;font-size:13px}.title span{font:10px ui-monospace,monospace;color:#879496}.tools{display:flex;gap:8px;color:#899597;font-size:11px}.body{display:grid;grid-template-columns:270px 1fr;min-height:0}.side{padding:20px;border-right:1px solid #30393a;background:#111718;overflow:auto}.side .tag{font:9px ui-monospace,monospace;letter-spacing:.12em;color:#708083}.side h1{font:21px/1.25 Georgia,serif;font-weight:400;margin:10px 0 18px}.note{font-size:12px;line-height:1.85;color:#b8c3c0;border-top:1px solid #30393a;padding-top:16px}.meta{margin-top:20px;font:10px/1.8 ui-monospace,monospace;color:#758380}.open{display:block;margin-top:18px;padding:9px 10px;border:1px solid #45645b;background:#172722;color:#dfeae5;text-decoration:none;text-align:center;font-size:11px}.frame{min-width:0;background:#202526}.frame iframe{width:100%;height:100%;border:0;background:#ddd}@media(max-width:760px){.body{grid-template-columns:1fr;grid-template-rows:auto 70vh}.side{border-right:0;border-bottom:1px solid #30393a}.app{height:auto;min-height:100%}}</style></head><body><div class="app"><header class="top"><div class="title"><b id="name">文件查看</b><span>ACRP / controlled public copy</span></div><div class="tools">只读&nbsp;&nbsp;·&nbsp;&nbsp;原始页码保留&nbsp;&nbsp; ⤢</div></header><main class="body"><aside class="side"><div class="tag">READING NOTE</div><h1 id="heading"></h1><div class="note" id="note"></div><div class="meta" id="meta"></div><a class="open" id="raw" target="_blank" rel="noopener">在浏览器原生阅读器中打开 ↗</a></aside><section class="frame"><iframe id="pdf" title="PDF"></iframe></section></main></div><script>const p=new URLSearchParams(location.search),f=p.get('file')||'community_contact_protocol.pdf';const D={
'community_contact_protocol.pdf':['社区接触与影像伦理流程','林澈把这份流程留在共享目录里不是为了让所有人背条款；真正要记住的是，现场的人随时可以拒绝、暂停或撤回同意，照片里看不到脸也不代表没有识别风险，路线、门牌和设备编号放在一起同样可能把人重新指认出来。','SOP ACRP-ETH-06 · v2.4 · Field Ethics Desk'],
'equipment_manifest_2026.pdf':['设备签出与归还 / UL-09','陈栩在失联后又把清单核了一遍，CAM-08 和 GPSMAP 67i 的签出记录最值得留意；如果别的页面出现同一台手持机，先对设备号、时间和归还状态，不要只凭照片里的外形认。','Issue register · UL-09 · logistics desk'],
'permit_ARZ-UL-2026-44.pdf':['ARZ-UL-2026-44 上游野外研究许可','这份许可划的是“能做什么”的边界，不是实际走过的路线；无人机、社区接触和上游坐标范围都在这里，但判断队伍最后去了哪里仍要回到轨迹和现场影像。','Permit rev 1.2 · public verification copy'],
