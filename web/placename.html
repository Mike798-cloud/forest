<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿泽拉地名志 · Ulen</title><style>body{margin:0;background:#fcfbf7;color:#292927;font-family:"Noto Serif SC",serif}.head{border-bottom:1px solid #bbb;padding:28px 6vw}.head b{font-size:26px}.entry{max-width:960px;margin:50px auto;padding:0 28px}.entry h1{font-size:44px;font-weight:400}.entry table{width:100%;border-collapse:collapse;margin:25px 0}.entry td{padding:10px;border-bottom:1px solid #ccc}.entry td:first-child{width:180px;color:#777}.entry p{line-height:1.9}.source{font-size:13px;color:#666}</style></head><body><header class="head"><b>阿泽拉地名志</b> · Historical Gazetteer</header><article class="entry"><h1>乌伦 / 乌仑 / Ulen</h1><table><tr><td>现行中文</td><td>乌伦河</td></tr><tr><td>历史拼写</td><td>Ulen, Oulun, Wulun</td></tr><tr><td>1978采集目录</td><td>“Amoka bend” 出现在上游第三支流西侧一处未定名河湾</td></tr></table><p>“Amoka”并非现行行政地名。1978年的采集者将它记录为当地向导提供的口头称呼，但没有说明是聚落、河湾还是家族名称。</p><p class="source">资料来源：国家地图馆1976图幅、阿泽拉自然史博物馆ARZ-78馆藏目录、1992地名标准化工作表。</p></article><nav class="relatedNav" style="max-width:900px;margin:30px auto 60px;padding:18px 24px;border-top:1px solid rgba(100,100,100,.35);font:13px/1.7 system-ui">相关公开资料　<a href="mapcatalog.html">旧地图馆</a>　<a href="../archive/1978.html">1978馆藏</a></nav></body></html>
