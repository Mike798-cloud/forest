<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第三支流是否存在永久居民点？——2017年调查报告</title><link rel="stylesheet" href="/assets/common.css"><style>body{background:#f7f6f1}.mast{border-bottom:3px double #262626;padding:22px 5vw;display:flex;justify-content:space-between;align-items:end}.mast b{font:38px Georgia,"SimSun",serif}.article{max-width:820px;margin:45px auto;padding:0 24px}.article h1{font:44px/1.2 Georgia,"SimSun",serif}.byline{border-top:1px solid #aaa;border-bottom:1px solid #aaa;padding:9px 0;color:#666}.article p{font:18px/1.9 Georgia,"SimSun",serif}.article blockquote{font:22px/1.65 Georgia,serif;border-left:4px solid #922;padding-left:22px}.article a{color:#145b89}.paper{background:white;padding:24px 30px;border:1px solid #ccc}.warning{background:#fff3da;padding:12px 16px}</style></head><body><header class="mast"><b>《雨林生态》期刊</b><span>ARCHIVE</span></header><article class="article"><h1>第三支流是否存在永久居民点？——2017年调查报告</h1><div class="byline">Liu et al. · 2017-09</div><p>摘要：研究团队在第三支流东岸布设12个样方和4台红外相机，未发现永久农业、建筑垃圾或长期居住痕迹，因此认为东岸调查区不存在常住居民点。</p><p class="warning"><b>方法限制：</b>受许可和水位限制，调查范围没有覆盖第三支流西岸及旧河道上游。论文结论只适用于划定样区。</p><p><a href="/assets/data/2017_eastbank_survey.pdf">下载原论文PDF</a></p></article><script src="/assets/state.js"></script><script>RF.ambient('room.ogg');RF.bindCross();RF.recordOpen('paper2017.html');</script></body></html>
