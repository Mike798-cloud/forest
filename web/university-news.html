<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨林大学新闻处</title><style>body{margin:0;color:#222;font:16px Arial,"Microsoft YaHei"}.head{border-top:8px solid #5b1630;padding:25px 6vw;border-bottom:1px solid #ddd}.head b{font-size:26px}.main{max-width:820px;margin:46px auto;padding:0 24px}.main h1{font:38px Georgia,"Noto Serif SC"}.main p{line-height:1.9}.date{color:#777}.contact{margin-top:40px;padding-top:20px;border-top:1px solid #ccc;font-size:13px}</style></head><body><header class="head"><b>雨林大学 · 新闻与公共事务</b></header><main class="main"><div class="date">2026-09-24</div><h1>学校确认与阿泽拉野外队建立后方联络</h1><p>学校已与当地搜救机构、保险方和项目合作单位建立联合联络。家属沟通由项目行政人员统一协调。</p><p>学校不会发布未经搜救机构核实的人员位置、健康状况或当地居民相关推断。网上流传的所谓“现场视频”目前均未得到项目方确认。</p><div class="contact">媒体联系人：newsroom@rainforest-univ.org</div></main><nav class="relatedNav" style="max-width:900px;margin:30px auto 60px;padding:18px 24px;border-top:1px solid rgba(100,100,100,.35);font:13px/1.7 system-ui">相关公开资料　<a href="../acrp/index.html">项目主页</a>　<a href="sar2011.html">官方搜救</a></nav></body></html>
