<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>乌伦河科考队仍未找到 搜救行动暂告段落</title><link href="/assets/common.css" rel="stylesheet"/><style>body{background:#f7f6f1}.mast{border-bottom:3px double #262626;padding:22px 5vw;display:flex;justify-content:space-between;align-items:end}.mast b{font:38px Georgia,"SimSun",serif}.article{max-width:820px;margin:45px auto;padding:0 24px}.article h1{font:44px/1.2 Georgia,"SimSun",serif}.byline{border-top:1px solid #aaa;border-bottom:1px solid #aaa;padding:9px 0;color:#666}.article p{font:18px/1.9 Georgia,"SimSun",serif}.article blockquote{font:22px/1.65 Georgia,serif;border-left:4px solid #922;padding-left:22px}.article a{color:#145b89}.paper{background:white;padding:24px 30px;border:1px solid #ccc}.warning{background:#fff3da;padding:12px 16px}</style></head><body><header class="mast"><b>南境时报</b><span>ARCHIVE</span></header><article class="article"><h1>乌伦河科考队仍未找到 搜救行动暂告段落</h1><div class="byline">2011-08-03 · 南境省地方新闻部</div><p>进入乌伦河上游的三名民间摄影者在7月中旬失去联系后，当地搜救队进行了十九天搜索。持续暴雨使第三支流多次改道，直升机只能在河谷短时间进入。</p><p>公开资料显示，三人最后一次可确认通信来自一台卫星短信设备。家属称他们原本计划在两天后沿旧河道返回，但搜救队没有在计划撤离点发现帐篷。</p><p>搜救部门昨日宣布大规模行动暂时结束，仍保留地方巡护员的线索通报渠道。</p><p><a data-new="" href="/web/sar2011.html" rel="noopener" target="_blank">相关：UL-2011-44公开搜救摘要</a></p></article><script src="/assets/state.js"></script><script>RF.ambient('room.ogg');RF.bindCross();RF.recordOpen('localnews.html');RF.mark('old_case_read',5);</script></body></html>
