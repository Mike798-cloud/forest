<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>等何屿回家</title><style>body{margin:0;background:#fffdf8;color:#42382f;font-family:"Noto Serif SC",serif}.head{padding:48px 8vw 26px;border-bottom:1px solid #e0d8c9}.head h1{font-weight:400}.post{max-width:680px;margin:50px auto;padding:0 20px}.post time{color:#998b7a}.post p{font-size:17px;line-height:2}.quote{background:#f6efe2;padding:16px;margin:24px 0;font-family:monospace}</style></head><body><header class="head"><h1>等何屿回家</h1><p>2011年家属博客归档</p></header><article class="post"><time>2011-08-17</time><h2>我们还在等一通电话</h2><p>搜救队说大范围飞行先停，但只要有新坐标还会核。很多陌生人给我们发“线索”，有人说看见他们，有人说听说那边有部落。我们现在只认设备时间和搜救员签字的东西。</p><div class="quote">何屿最后短信：雨太大，改走西边高一点的旧路。明天如果信号好再报。</div><p>这句话我已经看了不知道多少遍。没有“神秘失踪”，没有传说，至少对我们来说只有三个人还没回来。</p></article><nav class="relatedNav" style="max-width:900px;margin:30px auto 60px;padding:18px 24px;border-top:1px solid rgba(100,100,100,.35);font:13px/1.7 system-ui">相关公开资料　<a href="localnews.html">地方新闻</a>　<a href="sar2011.html">搜救摘要</a></nav></body></html>
