<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山岭见闻 · 乌伦无人区？</title><style>body{margin:0;background:#f4f0e7;color:#342c24;font-family:Georgia,"Noto Serif SC",serif}.head{padding:34px 7vw;border-bottom:1px solid #cabda9}.head b{font-size:26px}.wrap{max-width:760px;margin:50px auto;padding:0 24px}.wrap h1{font-size:42px;font-weight:400}.by{color:#867767}.wrap p{line-height:2;font-size:17px}.quote{font-size:22px;border-left:3px solid #8c6f4a;padding-left:20px;margin:30px 0;color:#5c4b38}</style></head><body><header class="head"><b>山岭见闻</b> / 个人野外笔记</header><main class="wrap"><h1>乌伦无人区？一段被忽视的灯光记录</h1><div class="by">2016-07-12 · MountainView</div><p>我第一次听到“上游夜里有固定灯”是在货车司机那儿。司机坚信那是偷木头的人，理由很简单：没人会在那个季节住进支流里面。</p><div class="quote">“灯不是一盏，是隔一会儿换一个位置。像有人沿着坡走。”</div><p>我后来查到附近确实有过非法采木处罚，所以当时也接受了这个解释。问题是林业公示里的许可区和处罚点都在东侧，司机看到的方向却在西边。也可能他记错了——事情已经过去很多年。</p><p>这篇文章不是调查结论，只是把我当年的笔记放出来。如果有人真去上游，请不要拿它当路线依据。</p></main><nav class="relatedNav" style="max-width:900px;margin:30px auto 60px;padding:18px 24px;border-top:1px solid rgba(100,100,100,.35);font:13px/1.7 system-ui">相关公开资料　<a href="trailtalk.html">论坛讨论</a>　<a href="forestry.html">林业许可</a></nav></body></html>
