read"><h1>GPSMAP 67i在峡谷里的漂移到底有多离谱？</h1><div class="reply"><div class="meta">mapfrog</div><p>我在花岗岩峡谷测过，单点能飘五六十米，但连续几个小时朝同一方向移动就不像纯漂移。</p></div><div class="reply"><div class="meta">周野</div><p>同意。67i真正麻烦的是云层和遮挡让点变稀，不太会自己“走”一条完整路线。</p></div><div class="reply"><div class="meta">oldboots</div><p>如果同时有海拔持续变化，最好拿雨量和计划线一起看。</p></div><div class="reply"><div class="meta">陈栩</div><p>还有别忘了天线朝向，胸前挂和塞包里差很多。</p></div></main><script src="/assets/state.js"></script><script>RF.ambient('room.ogg');RF.bindCross();</script></body></html>
