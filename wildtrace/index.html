ass="profile"><div class="profiletext"><img src="/assets/photos/profile_zhou.webp"><div><h1>周野 <small>Ye Zhou</small></h1><p>山会记得，雨我也会记得。</p><div class="stats"><span><b>132</b> 动态</span><span><b>48</b> 路线</span><span><b>2.4k</b> 粉丝</span><span><b>316</b> 关注</span></div></div></div></section><section class="feed"><article class="post"><div class="tiny">2024-11-16 · 乌伦上游</div><h3>第三支流，第二次</h3><p>这片河每年都完全不一样。下次再来一定要把旧鞋扔头。</p><div class="tripimgs"><img src="/assets/photos/normal_01.webp"><img src="/assets/photos/normal_02.webp"><img src="/assets/photos/normal_03.webp"><img src="/assets/photos/normal_04.webp"></div></article><article class="post"><div class="tiny">2023-04-03 · 帽山</div><h3>旧林道</h3><p>今天试了一只国产炉头，陈栩一路说它一定会坏，结果他的咖啡杯先摔了。</p></article><article class="post"><div class="tiny">2021-08-19 · 哈巴</div><h3>五天雨</h3><p>林澈不许我们拿止痛片顶高反，许放在帐篷里给大家重算了三遍撤退时间。那次以后我终于相信“保守一点”不是骂人。</p></article></section></main><script src="/assets/state.js"></script><script>RF.ambient('jungle.ogg');RF.bindCross();</script></body></html>
