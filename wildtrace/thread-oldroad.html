<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧林道岔口怎么判断“能走”和“只是看着能走” · WildTrace</title><link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../styles/wild.css"></head><body><header class="wtTop"><b>WildTrace</b><nav><a href="index.html">动态</a><a href="routes.html">路线</a><a href="community.html">社区</a><a href="gear.html">装备</a></nav></header><main class="thread"><p><a href="community.html">← 社区</a></p><h1>旧林道岔口怎么判断“能走”和“只是看着能走”</h1><article class="post"><div><div class="user">周野</div><div class="muted tiny">2026-08-13</div></div><div><p>我会先看路面是不是连续被踩出来的，再看排水和植被。单凭“前面好像有路”很容易把自己送进一条废线。</p></div></article><article class="post"><div><div class="user">GeoLin</div><div class="muted tiny">2026-08-14</div></div><div><p>地图上的旧线也不一定比现场可靠，尤其林业路废弃几年以后。</p></div></article><article class="post"><div><div class="user">许放</div><div class="muted tiny">2026-08-15</div></div><div><p>对陌生队伍来说，最重要的问题不是能不能走，是走错以后能不能在规定时间内退回来。</p></div></article></main></body></html>
