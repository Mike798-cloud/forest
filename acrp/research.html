href="/acrp/news.html">新闻与公告</a></nav></header><main class="acrp-main"><h1>研究方向</h1><div class="columns"><h2>声学生态</h2><p>以低功耗记录器建立夜间声景数据库，研究雨季声音环境对灵长类和两栖动物活动的影响。</p><h2>水文与路径</h2><p>持续记录第三支流雨量、水位与可通行性，路线调整只在天气和安全条件允许时执行。</p><h2>社区与语言</h2><p>对偶遇居民采取最小干预原则，不主动进入居住空间，不采集身份信息，不以影像换取物资。</p><h2>公开数据</h2><p>坐标数据按保护等级发布。涉及居民点和濒危物种的数据会延迟或降低空间精度。</p></div></main><script src="/assets/state.js"></script><script>RF.ambient('room.ogg');RF.bindCross();</script></body></html>
