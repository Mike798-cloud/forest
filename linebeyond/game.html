<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game · The Line Beyond</title><link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../styles/old.css"></head><body><div class="old"><header class="head"><b>The Line Beyond / Game</b><span>2011.08.07</span></header><nav class="nav"><a href="index.html">Home</a><a href="game.html">Game</a><a href="fragments.html">Fragments</a><a href="guestbook.html">Guestbook</a></nav><main class="main"><div class="gamegrid"><canvas id="game" width="640" height="430"></canvas><aside><h3>操作</h3><p>方向键移动。红色石门不会告诉你答案；先看Fragments里四种形出现的环境，再决定从哪一块开始按。</p><div id="gateBox"></div></aside></div></main></div><script src="../assets/state.js"></script><script>RF.ambient('crt.ogg');const map=['####################','#....#.............#','#.##.#.#####.####..#','#....#.....#....#..#','#.######.#.#.##.#..#','#........#....#....#','####.########.#.##.#','#....#......#.#....#','#.##.#.####.#.####G#','#..................#','####################'];let x=1,y=9;const C=game,ctx=C.getContext('2d'),cw=32,ch=39;function draw(){ctx.fillStyle='#020602';ctx.fillRect(0,0,640,430);for(let yy=0;yy<map.length;yy++)for(let xx=0;xx<map[yy].length;xx++){let v=map[yy][xx];if(v==='#'){ctx.fillStyle='#173626';ctx.fillRect(xx*cw,yy*ch,31,38)}else if(v==='G'){ctx.fillStyle='#77251d';ctx.fillRect(xx*cw,yy*ch,31,38)}}ctx.fillStyle='#ddd7b6';ctx.fillRect(x*cw+10,y*ch+8,12,22)}draw();C.tabIndex=0;C.focus();C.onkeydown=e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!d)return;e.preventDefault();let nx=x+d[0],ny=y+d[1],v=map[ny]?.[nx];if(v&&v!=='#'){x=nx;y=ny;draw();if(v==='G')gate()}};function gate(){const symbols=[['水痕','rain'],['旧路','road'],['折回','return'],['门内','home']];gateBox.innerHTML='<div class="gate"><b>石门四块按板</b><p>门上没有文字，只有四个磨损程度不同的凹槽。你只能根据Fragments记录的“出现环境”和缺口方向排列。</p><div id="slots"></div><p>先后点击四块按板；点错可以重来。</p><button id="clear">清空</button><div id="msg"></div></div>';let seq=[];const box=document.getElementById('slots');symbols.forEach(([lab,val])=>{const b=document.createElement('button');b.className='slot';b.textContent=lab;b.onclick=()=>{if(seq.includes(val))return;seq.push(val);b.classList.add('on');if(seq.length===4)check()};box.appendChild(b)});clear.onclick=()=>{seq=[];box.querySelectorAll('.slot').forEach(b=>b.classList.remove('on'));msg.textContent=''};function check(){if(seq.join(',')==='rain,road,return,home'){RF.mark('oldgame_gate');msg.innerHTML='<div class="hiddenPage"><b>隐藏页 / OLD CHANNEL</b><p>作者把2011年一张“旧河槽叠图”嵌在地图里，并留下备注：雨后不要跟新水线走，西边高一点的旧路才回得去。</p><p>镜像索引显示，这个隐藏页在2026-09-22被复制进ARZ-04现场终端。</p><a target="_blank" rel="noopener" href="../satcache/index.html">打开 ARZ-04 缓存对象 ↗</a></div>'}else msg.textContent='按板重新弹起。石门没有动。'}}</script></body></html>
