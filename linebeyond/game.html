<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Line Beyond · Game</title><link rel="stylesheet" href="/assets/common.css"><style>body{background:#10100c;color:#d6d1b0;font:15px "Times New Roman",serif;background-image:repeating-linear-gradient(0deg,#0d100d 0 2px,#10110e 2px 4px)}.old{width:960px;max-width:100%;margin:0 auto;background:#070906;border-left:1px solid #68644f;border-right:1px solid #68644f;min-height:100vh}.old header{padding:18px 22px;border-bottom:1px dotted #7a7357;display:flex;justify-content:space-between}.old nav{padding:8px 20px;background:#17180e}.old nav a{color:#d7cf96;margin-right:18px}.old main{padding:25px}.gamewrap{display:grid;grid-template-columns:640px 1fr;gap:18px}canvas{border:2px inset #81795a;background:#000;max-width:100%}.old table{border-collapse:collapse}.old td,.old th{border:1px solid #777;padding:6px}.gate{margin-top:14px;border:1px dashed #8c7c4e;padding:12px}.choices button{background:#16160f;color:#dfd6a4;border:1px solid #6f6649;padding:7px;margin:4px}.hiddenmap{padding:12px;background:#15180f;border:1px solid #55664e;margin-top:12px}.old a{color:#9dc8b0}@media(max-width:980px){.gamewrap{grid-template-columns:1fr}}</style></head><body><div class="old"><header><b>The Line Beyond / Game</b><span>2011.08.07</span></header><nav><a href="/linebeyond/">首页</a><a href="/linebeyond/game.html">游戏</a><a href="/linebeyond/fragments.html">碎片</a><a href="/linebeyond/guestbook.html">留言簿</a></nav><main><div class="gamewrap"><canvas id="game" width="640" height="430"></canvas><aside><h3>操作</h3><p>方向键移动。红色位置是旧石门。</p><p>如果门打不开，先去“碎片”看我抄下来的东西。</p><div id="gateBox"></div></aside></div></main></div><script src="/assets/state.js"></script><script>RF.ambient('crt.ogg');RF.bindCross();const map=['####################','#....#.............#','#.##.#.#####.####..#','#....#.....#....#..#','#.######.#.#.##.#..#','#........#....#....#','####.########.#.##.#','#....#......#.#....#','#.##.#.####.#.####G#','#..................#','####################'];let x=1,y=9;const c=game,ctx=c.getContext('2d'),cw=32,ch=39;function draw(){ctx.fillStyle='#020602';ctx.fillRect(0,0,640,430);for(let yy=0;yy<map.length;yy++)for(let xx=0;xx<map[yy].length;xx++){let v=map[yy][xx];if(v==='#'){ctx.fillStyle='#173626';ctx.fillRect(xx*cw,yy*ch,31,38)}else if(v==='G'){ctx.fillStyle='#77251d';ctx.fillRect(xx*cw,yy*ch,31,38)}}ctx.fillStyle='#ddd7b6';ctx.fillRect(x*cw+10,y*ch+8,12,22)}draw();c.tabIndex=0;c.focus();c.onkeydown=e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!d)return;e.preventDefault();let nx=x+d[0],ny=y+d[1],v=map[ny]?.[nx];if(v&&v!=='#'){x=nx;y=ny;draw();if(v==='G')gate()}};function gate(){gateBox.innerHTML='<div class="gate"><b>四个凹槽</b><p>水痕、鞋磨出的细沟、折回箭头、门框形刻痕。缺口方向和“碎片”页的抄写一致。</p><div class="choices">雨 <select id=a><option>?</option><option value=rain>雨</option><option value=road>路</option><option value=return>返</option><option value=home>家</option></select> 路 <select id=b><option>?</option><option value=road>路</option><option value=rain>雨</option></select> 折回 <select id=d><option>?</option><option value=return>返</option><option value=home>家</option></select> 门框 <select id=e><option>?</option><option value=home>家</option><option value=eye>眼</option></select></div><button id=try>按下石板</button><div id=msg></div></div>';document.getElementById('try').onclick=()=>{if(a.value==='rain'&&b.value==='road'&&d.value==='return'&&e.value==='home'){RF.mark('oldgame_gate',8);document.getElementById('msg').innerHTML='<div class="hiddenmap"><b>隐藏页：旧河槽叠图</b><p>作者备注：雨后不要跟新水线走，旧路在西侧高一点。2011镜像被周野在2026-09-22复制进ARZ-04现场终端。</p><a data-new href="/satcache/">打开ARZ-04镜像对象 ↗</a></div>';RF.bindCross()}else document.getElementById('msg').textContent='石板没有动。'}}</script></body></html>
