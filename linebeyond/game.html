<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game · The Line Beyond</title><link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../styles/old.css"></head><body><div class="old"><header class="head"><b>The Line Beyond / Game</b><span>2011.08.07</span></header><nav class="nav"><a href="index.html">Home</a><a href="game.html">Game</a><a href="fragments.html">Fragments</a><a href="guestbook.html">Guestbook</a></nav><main class="main"><div class="gamegrid"><canvas id="game" width="640" height="430"></canvas><aside><h3>操作</h3><p>方向键移动。石门上的四块按板磨损程度不同；站内其他页面也出现过相同的形。</p><div class="touchPad" aria-label="触控方向键"><button data-key="ArrowUp">↑</button><span><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></span></div><div id="gateBox"></div></aside></div></main></div><script src="../assets/state.js"></script><script>RF.ambient('crt.ogg');const map=['####################','#....#.............#','#.##.#.#####.####..#','#....#.....#....#..#','#.######.#.#.##.#..#','#........#....#....#','####.########.#.##.#','#....#......#.#....#','#.##.#.####.#.####G#','#..................#','####################'];let x=1,y=1;const C=game,ctx=C.getContext('2d'),cw=32,ch=39;function draw(){ctx.fillStyle='#020602';ctx.fillRect(0,0,640,430);for(let yy=0;yy<map.length;yy++)for(let xx=0;xx<map[yy].length;xx++){let v=map[yy][xx];if(v==='#'){ctx.fillStyle='#173626';ctx.fillRect(xx*cw,yy*ch,31,38)}else if(v==='G'){ctx.fillStyle='#77251d';ctx.fillRect(xx*cw,yy*ch,31,38)}}ctx.fillStyle='#ddd7b6';ctx.fillRect(x*cw+10,y*ch+8,12,22)}draw();C.tabIndex=0;C.focus();function move(key){const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[key];if(!d)return;let nx=x+d[0],ny=y+d[1],v=map[ny]?.[nx];if(v&&v!=='#'){x=nx;y=ny;draw();if(v==='G')gate()}}C.onkeydown=e=>{if(!/^Arrow/.test(e.key))return;e.preventDefault();move(e.key)};document.querySelectorAll('.touchPad button').forEach(b=>b.onclick=()=>move(b.dataset.key));function gate(){
 const glyphs=[['../assets/ui/glyph_7.png','return'],['../assets/ui/glyph_3.png','home'],['../assets/ui/glyph_6.png','rain'],['../assets/ui/glyph_5.png','road']];
 gateBox.innerHTML='<div class="gate"><b>第一层：四块磨损按板</b><p>门边没有翻译。四块按板和Fragments里记录的环境对应，按板表面的缺口方向也完全一样。</p><div id="slots" style="display:flex;gap:8px;flex-wrap:wrap"></div><p>顺序错了以后会全部弹起。</p><button id="clear">清空</button><div id="msg"></div></div>';
 let seq=[];const box=document.getElementById('slots');glyphs.forEach(([src,val])=>{const b=document.createElement('button');b.className='slot';b.innerHTML='<img src="'+src+'" style="width:74px;height:52px;object-fit:contain">';b.onclick=()=>{if(seq.includes(val))return;seq.push(val);b.classList.add('on');if(seq.length===4)check1()};box.appendChild(b)});
 clear.onclick=()=>{seq=[];box.querySelectorAll('.slot').forEach(b=>b.classList.remove('on'));msg.textContent=''};
 function check1(){if(!RF.has('fragments_read')){msg.textContent='按板没有响应。旧站里那页抄形记录也许还缺一次对照。';return}if(seq.join(',')==='rain,road,return,home'){msg.innerHTML='<p>四块按板没有弹回，但锁芯只转了半圈。门框上铅笔写着：<em>用Fragments里的四个环境词，按顺序写成四段。</em></p><input id="phrase" placeholder="____ / ____ / ____ / ____" style="max-width:310px"><button id="confirmPhrase">确认抄录</button>';confirmPhrase.onclick=()=>{const v=phrase.value.replace(/\s/g,'');if(/雨.*路.*折返.*屋|水痕.*旧路.*折返.*屋/.test(v))stage2();else msg.insertAdjacentHTML('beforeend','<p>锁芯又退回去一点。抄录词和Fragments的出现环境对不上。</p>')}}else{msg.textContent='按板同时弹回原位。门后传来一声很轻的卡扣声。'}}
 function stage2(){msg.innerHTML='<div class="hiddenPage"><b>第二层：三联形</b><p>门缝里露出另一组刻痕。它不是1978抄本中的单个形，而是三组并列。</p><div style="display:flex;gap:10px;align-items:center;background:#0a0f0b;padding:12px"><img src="../assets/ui/glyph_2.png" style="width:78px"><img src="../assets/ui/glyph_4.png" style="width:78px"><img src="../assets/ui/glyph_8.png" style="width:78px"></div><p>Fragments只写过它们各自出现的环境。请选择最值得继续核对的资料组合，而不是直接给它翻译。</p><div id="infer"></div><div id="inferMsg"></div></div>';
   const opts=[['路线高程 + 雨量计','route'],['2011天气记录 + 设备清单','weather'],['1978儿童墙 + 2026医疗批注','context']];const d=document.getElementById('infer');opts.forEach(([lab,val])=>{const b=document.createElement('button');b.textContent=lab;b.style.display='block';b.style.margin='7px 0';b.onclick=()=>{if(val==='context'){if(RF.has('glyph_sheet_read')&&RF.has('medical_read'))stage3();else document.getElementById('inferMsg').textContent='缺少1978对照页或2026医疗工作簿，无法把两批出现位置放到一起核对。'}else document.getElementById('inferMsg').textContent='这组资料无法解释三种刻痕为什么总在同一类场景旁出现。'};d.appendChild(b)});
 }
 function stage3(){const m=document.getElementById('inferMsg');m.innerHTML='<div style="margin-top:16px"><b>第三层：方向缺口</b><p>同一组三联形出现两次：左边缺口朝门内，右边缺口朝河道。1978抄本只记录过“方向变化伴随出现位置变化”。门边有两个机械拨片。</p><button id="river">把缺口拨向河道</button> <button id="inside">把缺口拨向门内</button><div id="last"></div></div>';document.getElementById('inside').onclick=finish;document.getElementById('river').onclick=()=>document.getElementById('last').textContent='拨片复位。门没有继续松动。';}
 function finish(){RF.mark('oldgame_gate');document.getElementById('last').innerHTML='<div class="hiddenPage"><b>OLD CHANNEL / hidden page</b><p>石门后只有一张2011旧河槽叠图和一个后来追加的镜像索引。图层名称与主页面不同，西侧旧路被单独描过。</p><p>镜像索引显示：2026-09-22，ARZ-04现场终端缓存过这个页面。</p><a target="_blank" rel="noopener" href="../satcache/index.html">打开 ARZ-04 缓存对象 ↗</a></div>';}
}
</script></body></html>
