<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fragments · The Line Beyond</title><link rel="stylesheet" href="../assets/common.css"><link rel="stylesheet" href="../styles/old.css"></head><body><div class="old"><header class="head"><b>Fragments</b><span>scan notes</span></header><nav class="nav"><a href="index.html">Home</a><a href="game.html">Game</a><a href="fragments.html">Fragments</a><a href="guestbook.html">Guestbook</a></nav><main class="main"><h1>抄下来的四组形</h1><p>我不知道这些是不是字。它们总在四种地方重复：暴雨后石边的水痕、旧路入口、回折记号、屋门内侧。方向缺口看起来比外轮廓更重要。</p><table class="clueTable"><tr><td>⌇⌇⌇</td><td>水痕旁出现；方向缺口向下</td></tr><tr><td>╱╲</td><td>旧路入口；和脚印同时出现</td></tr><tr><td>↶</td><td>回折记号；通常不是原路返回</td></tr><tr><td>⊓</td><td>门内侧；和儿童涂写同墙</td></tr></table><p>我没有给这些形写中文释义，只保留了它们出现的位置和方向。首页那张旧地图里也有同样四组痕迹，我当时照着现场顺序做进了石门；几年没碰，已经不记得自己把哪一组放在最前面。</p></main></div></body></html>
