<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜救协调系统 · 补充材料</title><link rel="stylesheet" href="../assets/common.css"><style>body{margin:0;background:#edf1f3;color:#202a31;font:14px Arial,"Microsoft YaHei"}.head{background:#15364d;color:white;padding:15px 5vw;display:flex;align-items:center}.seal{width:42px;height:42px;border:2px solid white;border-radius:50%;display:grid;place-items:center;margin-right:15px}.main{max-width:1020px;margin:30px auto;background:white;border:1px solid #c9d3d8;padding:32px}.case{font-family:monospace;color:#637681}.main h1{font-size:26px}.intro{max-width:760px;line-height:1.75}.form{display:grid;grid-template-columns:190px 1fr;gap:16px;margin-top:28px}.form label{font-weight:700}.form input,.form textarea,.form select{padding:10px;border:1px solid #b8c5cb;width:100%}.form textarea{min-height:110px}.submit{grid-column:2;width:150px;border:0;background:#1b628e;color:white;padding:11px}.err{grid-column:2;color:#a12f2d}.history{margin-left:auto;color:white;text-decoration:none;font-size:13px}@media(max-width:720px){.main{margin:0;border:0}.form{grid-template-columns:1fr}.submit,.err{grid-column:1}}</style></head><body><header class="head"><div class="seal">应</div><div><b>国家应急管理部 · 失联人员搜救信息上报</b><div class="tiny">SEARCH & RESCUE COORDINATION</div></div><a class="history" target="_blank" href="../web/sar2011.html">历史公开案件</a></header><main class="main"><div class="case">EM-2026-0924-ARZ · supplementary evidence</div><h1>阿泽拉雨林科考队失联事件</h1><p class="intro">补充材料只填写能够复核的位置、时间、来源与风险说明。当地居民身份、宗教、犯罪性质或传闻不作为搜救路线依据。</p><form id="f" class="form"><label>区域中心</label><input value="2.4131N, 114.2296E" readonly><label>来源组合</label><select><option>GPS轨迹 + 降雨记录 + DJI代理帧</option></select><label>风险说明</label><textarea id="risk" placeholder="写明河况、旧河槽、最后轨迹和无人机帧之间能够复核的关系。"></textarea><label>附件说明</label><textarea id="att" placeholder="例如：DJI_0509_PROXY.JPG / 17:42:31；UL09 GPS 09/22 17:43"></textarea><div class="err" id="err"></div><button class="submit">提交材料</button></form></main><script src="../assets/state.js"></script><script>if(!RF.requireMark('survey_verified','../survey/index.html','搜救系统只接受你刚刚在Survey Review中完成的可复核影像坐标。'))throw new Error('locked');f.onsubmit=e=>{e.preventDefault();if(risk.value.trim().length<45){err.textContent='说明过短。请至少写清楚GPS、河况与影像三者如何互相复核。';return}RF.STATE.submitted=true;RF.save();location.href='done.html'}</script></body></html>
