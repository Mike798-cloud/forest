<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜救协调系统 · 补充材料</title><link rel="stylesheet" href="/assets/common.css"><style>body{background:#edf1f3;color:#202a31}.sar-head{background:#14334a;color:white;display:flex;align-items:center;padding:15px 4vw;gap:20px}.seal{width:38px;height:38px;border:2px solid white;border-radius:50%;display:grid;place-items:center}.sar-head nav{margin-left:auto;display:flex;gap:20px}.sar-head a{text-decoration:none}.sar-main{max-width:1060px;margin:36px auto;background:white;border:1px solid #cfd7dc;padding:34px}.sar-main h1{font-size:27px}.case{font-family:monospace;color:#60717b}.form{display:grid;grid-template-columns:190px 1fr;gap:16px 18px;margin-top:30px}.form label{font-weight:700}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #b8c4ca}.form textarea{min-height:110px}.submit{grid-column:2;background:#1b5e8a;color:white;border:0;padding:12px 28px;width:160px}.error{grid-column:2;color:#9f2f2a}.done{max-width:820px;margin:60px auto;font:18px/1.9 Georgia,serif;background:white;padding:44px}.notice{margin-top:40px;border-top:1px solid #ccc;padding-top:24px;font-family:Arial;font-size:13px}</style></head><body><header class="sar-head"><div class="seal">应</div><div><b>国家应急管理部 · 失联人员搜救信息上报系统</b><div class="tiny">SEARCH AND RESCUE COORDINATION</div></div><nav><a href="/sar/">案件登记</a><a href="/web/sar2011.html">历史公开案件</a></nav></header><main class="sar-main"><div class="case">EM-2026-0924-ARZ · 补充材料</div><h1>阿泽拉雨林科考队失联事件</h1><p>补充材料只应包含可由现场人员复核的位置、时间、来源和风险说明。对当地居民身份、宗教或犯罪性质的推断不作为路线依据。</p><form id="f" class="form"><label>坐标 / 区域中心</label><input id="coord" value="1.6512N, 102.3748E"><label>来源组合</label><select id="basis"><option>GPS轨迹 + 降雨记录 + 无人机代理帧</option><option>GPS轨迹 + 现场改线记录</option></select><label>风险说明</label><textarea id="risk" placeholder="说明河况、旧河槽、最后轨迹与人工路径之间可以复核的关系。"></textarea><label>附件说明</label><textarea id="att" placeholder="可填写文件名、时间或网页来源。"></textarea><div id="err" class="error"></div><button class="submit">提交材料</button></form></main><script src="/assets/state.js"></script><script>RF.ambient('room.ogg');RF.bindCross();f.onsubmit=e=>{e.preventDefault();if(!RF.has('survey_verified')){err.textContent='当前坐标没有附带可复核的现场影像。';return}if(risk.value.trim().length<35){err.textContent='风险说明过短，请写明可复核事实。';return}RF.STATE.submitted=true;RF.save();location.href='/sar/done.html'}</script></body></html>
