<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜救协调系统 · 补充材料</title><link rel="stylesheet" href="../assets/common.css"><style>body{margin:0;background:#edf1f3;color:#202a31;font:14px Arial,"Microsoft YaHei"}.head{background:#15364d;color:white;padding:15px 5vw;display:flex;align-items:center}.seal{width:42px;height:42px;border:2px solid white;border-radius:50%;display:grid;place-items:center;margin-right:15px}.main{max-width:1080px;margin:30px auto;background:white;border:1px solid #c9d3d8;padding:32px}.case{font-family:monospace;color:#637681}.main h1{font-size:26px}.intro{max-width:820px;line-height:1.75}.steps{display:flex;gap:0;border-bottom:1px solid #c7d2d8;margin:24px 0}.steps span{padding:10px 18px;border-right:1px solid #d5dee2;color:#73838c}.steps .on{background:#eef4f7;color:#174c6d;font-weight:700}.form{display:grid;grid-template-columns:190px 1fr;gap:15px 18px;margin-top:22px}.form label{font-weight:700;padding-top:9px}.form input,.form textarea,.form select{padding:10px;border:1px solid #b8c5cb;width:100%;background:#fff}.form textarea{min-height:88px;line-height:1.65}.help{font-size:12px;color:#71818a;margin-top:5px}.submit{grid-column:2;width:150px;border:0;background:#1b628e;color:white;padding:11px;cursor:pointer}.err{grid-column:2;color:#a12f2d}.history{margin-left:auto;color:white;text-decoration:none;font-size:13px}.evidenceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.evidenceGrid label{font-weight:400;border:1px solid #d0d9de;padding:10px;background:#f8fafb}.evidenceGrid input{width:auto;margin-right:6px}@media(max-width:720px){.main{margin:0;border:0}.form{grid-template-columns:1fr}.submit,.err{grid-column:1}.evidenceGrid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="seal">应</div><div><b>国家应急管理部 · 失联人员搜救信息上报</b><div class="tiny">SEARCH & RESCUE COORDINATION</div></div><a class="history" target="_blank" rel="noopener" href="../web/sar2011.html">历史公开案件</a></header><main class="main"><div class="case">EM-2026-0924-ARZ · supplementary evidence</div><h1>阿泽拉雨林科考队失联事件</h1><p class="intro">本页用于补充可复核的时间、位置和风险资料。所有结论都应能回到原始GPS、设备时间戳、气象或影像对象；关于当地居民身份、宗教、犯罪性质的推测不会进入路线规划字段。</p><div class="steps"><span>1 基本信息</span><span>2 位置依据</span><span class="on">3 补充证据</span><span>4 提交</span></div><form id="f" class="form"><label>建议复核区域</label><div><input value="2.4131N, 114.2296E" readonly><div class="help">来自Survey Review当前配准结果，不代表人员位置。</div></div><label>证据来源</label><div class="evidenceGrid"><label><input type="checkbox" id="gps" checked> UL-09 GPS轨迹</label><label><input type="checkbox" id="weather" checked> 雨量/河位记录</label><label><input type="checkbox" id="image" checked> DJI代理帧</label></div><label>时间依据</label><textarea id="timeBasis" placeholder="例如：最后完整GPS写入时间、代理帧拍摄时间、卫星箱同步时间。"></textarea><label>位置依据</label><textarea id="locationBasis" placeholder="写明计划线、实际轨迹、旧河槽或配准残差等可复核信息。"></textarea><label>环境风险</label><textarea id="risk" placeholder="河位、降雨、坡面或其他会影响搜救进入方式的条件。"></textarea><label>附件与对象</label><textarea id="att" placeholder="文件名 / 数据集ID / 时间戳，可一行一个。"></textarea><div class="err" id="err"></div><button class="submit">提交补充材料</button></form></main><script src="../assets/state.js"></script><script>if(!RF.requireMark('survey_verified','../survey/index.html','当前案件尚未收到可用的影像配准对象。'))throw new Error('locked');f.onsubmit=e=>{e.preventDefault();const fields=[timeBasis,locationBasis,risk,att];if(fields.some(x=>x.value.trim().length<12)){err.textContent='有必填字段仍缺少可复核信息。';return}RF.STATE.submitted=true;RF.save();location.href='done.html'}</script></body></html>
