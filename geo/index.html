<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoExplorer Pro · UL-09</title><link rel="stylesheet" href="/assets/common.css"><style>html,body{height:100%;overflow:hidden;background:#06110f;color:#d7e2dd}.geo{height:100vh;position:relative;background:#081614}.map{position:absolute;inset:0;background:url('/assets/maps/ulen_topo.webp') center/cover;transform-origin:center}.map:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,14,11,.12),rgba(4,14,11,.02))}.layers{position:absolute;left:18px;top:18px;width:230px;background:rgba(5,17,14,.88);border:1px solid #38544c;padding:16px}.layers h3{margin:0 0 13px;font:13px monospace;letter-spacing:.15em}.layers label{display:block;padding:8px 0;border-top:1px solid #213a34;font-size:13px}.info{position:absolute;right:18px;top:18px;width:300px;background:#f0f2ed;color:#1d2925;padding:18px;box-shadow:0 12px 36px #0006}.info h2{font:24px Georgia,serif;margin:0 0 10px}.timeline{position:absolute;left:22%;right:22%;bottom:18px;background:rgba(4,17,14,.9);padding:14px;color:#cfe1d8}.timeline input{width:100%}.point{position:absolute;width:15px;height:15px;border-radius:50%;background:#f89a42;border:2px solid white;cursor:pointer;z-index:5}.p1{left:28%;top:29%}.p2{left:43%;top:48%}.p3{left:57%;top:55%}.p4{left:70%;top:66%;background:#d94232}.rain{position:absolute;inset:0;background:url('/assets/maps/rain_overlay.webp') center/cover;opacity:.42;mix-blend-mode:screen}.route{position:absolute;left:22%;top:22%;width:57%;height:52%;transform:rotate(13deg);opacity:.85}.route.actual{border-bottom:4px solid #f1a24f}.route.plan{left:20%;top:18%;border-bottom:3px dashed #c8d4d0;transform:rotate(9deg);opacity:.55}.dronecov{position:absolute;left:62%;top:38%;width:17%;height:24%;border:2px solid #63b5bd;background:#63b5bd22;transform:rotate(-8deg)}.tools{position:absolute;left:18px;bottom:18px;display:flex;gap:8px}.tools button{width:38px;height:38px;background:#091d18;color:#d8e6e1;border:1px solid #3e5e54}.mediaLink{display:block;margin-top:16px;color:#1b6272}</style></head><body><div class="geo"><div class="map" id="map"><div class="route plan" id="planRoute"></div><div class="route actual" id="actualRoute"></div><div class="dronecov hidden" id="droneCov"></div><div class="point p1" data-time="09/21 12:05" data-alt="391m"></div><div class="point p2" data-time="09/21 16:42" data-alt="417m"></div><div class="point p3" data-time="09/22 09:18" data-alt="424m"></div><div class="point p4" data-time="09/22 17:43" data-alt="428m"></div></div><aside class="layers"><h3>LAYERS / UL-09</h3><label><input id="rain" type="checkbox"> 累计降雨 09/18–09/22</label><label><input id="actualToggle" checked type="checkbox"> GPS轨迹（队伍）</label><label><input id="planToggle" checked type="checkbox"> 计划路线</label><label><input id="droneToggle" type="checkbox"> 无人机覆盖（09/22）</label></aside><aside class="info" id="info"><h2>UL-09</h2><p>选择轨迹点查看时间、海拔和同步精度。雨量层与轨迹时间可以交叉查看。</p><dl><dt>最后完整同步</dt><dd>09/22 17:43</dd><dt>记录设备</dt><dd>GPSMAP 67i</dd></dl></aside><div class="timeline"><div>09/21 06:00 <span style="float:right">09/23 06:00</span></div><input id="time" type="range" min="0" max="100" value="68"></div><div class="tools"><button id="zin">+</button><button id="zout">−</button><button id="reset">⌖</button></div></div><script src="/assets/state.js"></script><script>RF.ambient('river.ogg');RF.bindCross();let z=1;const map=document.getElementById('map');function apply(){map.style.transform='scale('+z+')'};zin.onclick=()=>{z=Math.min(1.8,z+.15);apply()};zout.onclick=()=>{z=Math.max(.8,z-.15);apply()};reset.onclick=()=>{z=1;apply()};rain.onchange=()=>{let r=document.querySelector('.rain');if(r)r.remove();if(rain.checked){r=document.createElement('div');r.className='rain';map.appendChild(r);RF.mark('gis_rain_seen',2)}};actualToggle.onchange=()=>actualRoute.classList.toggle('hidden',!actualToggle.checked);planToggle.onchange=()=>planRoute.classList.toggle('hidden',!planToggle.checked);droneToggle.onchange=()=>droneCov.classList.toggle('hidden',!droneToggle.checked);document.querySelectorAll('.point').forEach((p,i)=>p.onclick=()=>{RF.mark('gis_offset_seen',2);info.innerHTML='<h2>轨迹点 '+(i+1)+'</h2><p><b>时间</b> '+p.dataset.time+'<br><b>海拔</b> '+p.dataset.alt+'<br><b>水平精度</b> ±8–19m</p><p>该点附近存在一组同期代理影像，可在项目共享相册中核对地表状态。</p>'+(i===3?'<a class="mediaLink" data-new href="/cloudline/">打开同期共享影像 ↗</a>':'');RF.bindCross();});</script></body></html>
